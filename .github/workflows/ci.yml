name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 自检脚本是零依赖的：**没装 node_modules 也要能跑**（Node ≥22.18 原生类型擦除）。
      # 这一步放在 install 之前是刻意的——它守住「克隆下来就能自检」这条性质。
      - name: 自检（零依赖）
        run: node tools/verify.ts

      - run: npm ci

      - name: 类型 + 产物契约
        run: npm run check

      # 产物必须与源码一致：改了 src 忘了 build 会在这里红，而不是让用户拿到过期产物。
      - name: 产物无漂移
        run: git diff --exit-code -- lib
